<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ Favicon (Tab Icon) -->
    <link rel="icon" type="image/svg+xml" href="/practivo-logo-mark.svg" />
    <link rel="alternate icon" type="image/png" href="/practivo-logo-mark.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practivo for Educators — Turn Your Viewers into Learners</title>

    <!-- Tailwind CSS CDN with forms and container queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: DM Sans & Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                900: '#312e81',
              }
            },
            boxShadow: {
              'glow-gold': '0 10px 25px -5px rgba(245, 158, 11, 0.18), 0 8px 10px -6px rgba(245, 158, 11, 0.1)',
              'subtle-card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
              'card-elevated': '0 4px 12px 0 rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05)',
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
